<html>
<body>

    <div class="card-header">
        <h3 class="grant-name">Valid FRC Grant</h3>

        <div class="grant-programs">
            <span class="program-tag frc">FRC</span>
        </div>

        <div class="grant-dates">
            <div class="date-item">Start: 08/01/2026</div>
            <div class="date-item">End: 09/30/2026</div>
        </div>

        <button
            class="grant-details-toggle"
            aria-controls="valid-details"
        ></button>
    </div>

    <div id="valid-details">
        <a
            class="grant-apply-btn"
            href="/grants/valid/apply"
        >
            Apply
        </a>
    </div>


    <div class="card-header">
        <h3 class="grant-name">Broken FRC Grant</h3>

        <div class="grant-programs">
            <span class="program-tag frc">FRC</span>
        </div>

        <div class="grant-dates">
            <div class="date-item">Start: definitely-not-a-date</div>
            <div class="date-item">End: 09/30/2026</div>
        </div>
    </div>

</body>
</html>
