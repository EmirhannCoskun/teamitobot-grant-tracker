target-version = "py312"
line-length = 88

# Mevcut ana modüller kendi work package'ları kapsamında biçimlendirilecek;
# bu gate yeni eklenen kod (CI, testler) üzerinde zorlanır.
extend-exclude = ["bot.py", "config.py", "database.py", "scraper.py"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["bot", "config", "database", "scraper"]
